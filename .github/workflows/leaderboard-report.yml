name: FIRST LEGO leaderboard report

# Scrapes the FIRST LEGO League World Championship leaderboard with Playwright
# and produces a PDF report. Runs on every push/PR that touches the project,
# manually via workflow_dispatch, and on a weekly schedule so the artifact
# stays current while the championship is live.

on:
  push:
    branches: [main]
    paths:
      - 'leaderboard-report/**'
      - '.github/workflows/leaderboard-report.yml'
  pull_request:
    paths:
      - 'leaderboard-report/**'
      - '.github/workflows/leaderboard-report.yml'
  workflow_dispatch:
    inputs:
      leaderboard_url:
        description: Override leaderboard URL (optional)
        required: false
        default: ''
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leaderboard-report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: leaderboard-report/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Scrape leaderboard
        env:
          LEADERBOARD_URL: ${{ github.event.inputs.leaderboard_url }}
          HEADLESS: 'true'
        run: npm run scrape

      - name: Generate PDF report
        run: npm run report

      - name: Upload PDF + data
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-report
          path: |
            leaderboard-report/output/leaderboard-report.pdf
            leaderboard-report/output/report.html
            leaderboard-report/data/leaderboard.json
            leaderboard-report/data/network/
          if-no-files-found: error
          retention-days: 30
